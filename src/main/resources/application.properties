spring.application.name=FlowerShop
spring.main.allow-circular-references=true

server.port=8080

# Error Handling / Hide Stacktrace from public responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# SQL Server Database Configuration 
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1435;databaseName=flower_shop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-reply@souflow.shop}
spring.mail.from-name=${MAIL_FROM_NAME:SouFlow Botanical Artistry}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:flower-shop}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=1s
spring.redis.connect-timeout=1s

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Giao Hang Nhanh (GHN) API
ghn.api-url=${GHN_API_URL:https://online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee}
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
ghn.from-district-id=${GHN_FROM_DISTRICT_ID:}

# SePay Webhook Secret
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:}

# JWT Token Secret
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:7200000}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:}

# Discord Webhooks
discord.webhook.contact=${DISCORD_WEBHOOK_CONTACT:}
discord.webhook.custom_order=${DISCORD_WEBHOOK_CUSTOM_ORDER:}
# Google Sheets Webhook
google.sheet.webhook=${GOOGLE_SHEET_WEBHOOK:}